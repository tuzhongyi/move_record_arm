<!DOCTYPE html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Pragma" content="no-cache" />

    <meta http-equiv="Cache-Control" content="no-cache" />
    <!-- <meta http-equiv=  "Expires" content=  "Sun Oct 15 2017 20:39:53 GMT+0800 (CST)"   />  -->
    <title>垃圾分类</title>
    <link rel="shortcut icon" href="../../../favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../../../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../../../assets/css/howell.css" />

    <script src="../../../assets/js/jquery.min.js"></script>
  </head>

  <body>
    <div class="network-nvr-config">
      <div class="network-nvr-config-body">
        <div class="forms">
          <div class="form-item">
            <div class="form-item-title">IP地址</div>
            <div class="form-item-value">
              <input type="text" autocomplete="off" id="IPAddress" />
            </div>
          </div>
          <div class="form-item">
            <div class="form-item-title">端口号</div>
            <div class="form-item-value">
              <input type="number" id="Port" min="0" max="65535" />
            </div>
          </div>
          <div class="form-item">
            <div class="form-item-title">用户名</div>
            <div class="form-item-value">
              <input
                type="text"
                autocomplete="off"
                autocomplete="new-password"
                id="Username"
              />
            </div>
          </div>
          <div class="form-item">
            <div class="form-item-title">密码</div>
            <div class="form-item-value">
              <input
                type="password"
                id="Password"
                autocomplete="new-password"
              />
            </div>
          </div>
          <div class="form-item">
            <div class="form-item-title">协议类型</div>
            <div class="form-item-value">
              <select id="ProtocolType"></select>
            </div>
          </div>
          <div class="form-item">
            <div class="form-item-title">是否在线</div>
            <div class="form-item-value">
              <input type="text" disabled="true" id="Connected" />
            </div>
          </div>
          <div class="form-item submit">
            <button class="button-blue default" id="save">
              <i class="howell-icon-save2"></i> 保存
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="./network-nvr-config.ts"></script>
</html>
